name: Deploy to GitHub Pages

on:
  push:
    branches: [master, demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/checkout@v4
        with:
          ref: demo
          path: demo-branch
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---------- Phase 1: ACS iTwin app → /acs-demo/acs/ ----------
      - name: Install ACS (iTwin) deps
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"   # test-only dev dep; skip the ~150MB browser
      - name: Build ACS (iTwin) app
        run: npm run build
        env:
          IMJS_BASE_PATH: /acs-demo/acs/

      # ---------- Phase 2 & 3: Cesium+SUMO / Esri toll twin → /acs-demo/twin/ ----------
      - name: Install toll-twin deps
        run: npm install
        working-directory: cesium-poc
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Build toll twin (Cesium + Esri, one bundle)
        run: npm run build
        working-directory: cesium-poc
        env:
          CESIUM_BASE_PATH: /acs-demo/twin/

      # ---------- Phase 4: demo branch (I-595 Digital Twin) → /acs-demo/demo/ ----------
      - name: Install demo branch deps
        run: npm install
        working-directory: demo-branch/cesium-poc
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Build demo branch (I-595)
        run: npm run build
        working-directory: demo-branch/cesium-poc
        env:
          CESIUM_BASE_PATH: /acs-demo/demo/
          VITE_SNAPSHOT_BASE: https://d3syo4sqvwi009.cloudfront.net/api/i595/camera
          VITE_ASK_THE_TWIN_API: https://d3syo4sqvwi009.cloudfront.net/api/i595/ask
          VITE_LIVE_EVENTS_API: https://d3syo4sqvwi009.cloudfront.net/api/i595/live-events
          VITE_WS_ENDPOINT: wss://b0wqexsnpk.execute-api.us-east-1.amazonaws.com/prod
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # The corridor GLB models (toll gantries, lane barrier) are fetched from the public
          # CloudFront distribution — the .glb files are not in the repo. Without this the models
          # resolve to null and those layers load nothing, silently.
          VITE_I595_MODEL_BASE_URL: https://d3syo4sqvwi009.cloudfront.net/data/models
          # Clipping Polygon Editor + Model Placement Editor, deliberately ON for this internal
          # demo deployment so the corridor work can be traced against the live scene. Set here
          # rather than in .env.production so the safe default still holds for any other build:
          # a local `npm run build` ships without the developer tooling.
          VITE_ENABLE_CESIUM_CLIP_EDITOR: "true"

      # ---------- Assemble the multi-demo site under one Pages root ----------
      - name: Assemble _site (launcher + acs/ + twin/)
        run: |
          # vite-plugin-cesium copies the Cesium runtime under the base path (dist/acs-demo/twin/cesium)
          # while vite's own assets go to dist/assets — inconsistent for sub-path serving. Hoist the
          # runtime to dist/cesium so it sits beside index.html/assets when dropped into _site/twin/.
          if [ -d cesium-poc/dist/acs-demo/twin/cesium ]; then
            mv cesium-poc/dist/acs-demo/twin/cesium cesium-poc/dist/cesium
            rm -rf cesium-poc/dist/acs-demo
          fi
          # Same hoist for the ROOT app: the A' tab's Cesium panel makes the ACS build emit its
          # cesium runtime at dist/acs-demo/acs/cesium — move it beside index.html/assets too.
          if [ -d dist/acs-demo/acs/cesium ]; then
            mv dist/acs-demo/acs/cesium dist/cesium
            rm -rf dist/acs-demo
          fi
          rm -rf _site && mkdir -p _site/acs _site/twin
          cp landing/index.html _site/index.html          # launcher = the front door
          cp landing/uc1-guide.html _site/uc1-guide.html   # UC1 presenter's guide, linked from the launcher tile
          cp -r dist/.          _site/acs/                 # Phase 1 (Bentley iTwin)
          cp -r cesium-poc/dist/. _site/twin/             # Phase 2 (Cesium) + Phase 3 (?renderer=arcgis)
          # Global SPA/OAuth fallback: GitHub Pages serves ONE 404.html for every unmatched path.
          # Point it at the ACS app's index so the Bentley redirect (/acs-demo/acs/signin-callback)
          # boots the iTwin SPA and completes the token exchange.
          cp _site/acs/index.html _site/404.html

          # Phase 4: demo branch I-595 Digital Twin → _site/demo/
          mkdir -p _site/demo
          if [ -d demo-branch/cesium-poc/dist/acs-demo/demo/cesium ]; then
            mv demo-branch/cesium-poc/dist/acs-demo/demo/cesium demo-branch/cesium-poc/dist/cesium
            rm -rf demo-branch/cesium-poc/dist/acs-demo
          fi
          cp -r demo-branch/cesium-poc/dist/. _site/demo/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
